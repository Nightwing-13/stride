<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Stride</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
  // Program/recipe content only exists as local files on the laptop (it's never published);
  // everywhere else it's downloaded from private cloud storage after sign-in.
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname))
    document.write('<script src="programs-data.js"><\/script><script src="recipes-data.js"><\/script>');
</script>
<style>
/* Iron theme: dark-first graphite, electric lime for actions/lifting, coral for cardio. */
:root{
  --bg:#111214; --card:#1b1d21; --card2:#24272d; --ink:#ecedee; --muted:#8a8f99; --line:#2a2d33;
  --primary:#c6f135; --on-primary:#111214; --accent:#ff6b4a; --on-accent:#111214;
  --lift:#c6f135; --lift-bg:rgba(198,241,53,.12); --good:#c6f135; --warn:#ffb547; --danger:#ff5c5c; --dot:#2f3238;
  --radius:14px; --tabbar:64px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:1000;background:rgba(17,18,20,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;letter-spacing:.12em;color:var(--primary);font-size:18px;text-decoration:none}
nav{display:flex;gap:4px}
nav a{color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:999px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
nav a svg{width:18px;height:18px}
nav a.on{background:var(--card2);color:var(--primary)}
nav a.rec{display:none}
.spacer{flex:1}
main{max-width:1040px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
h1,h2,h3{margin:0 0 8px;letter-spacing:-.01em} h1{font-size:26px;font-weight:800} h2{font-size:18px;font-weight:700} h3{font-size:15px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
a{color:var(--primary)}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:10px 16px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;transition:transform .08s ease,background .15s ease}
button:active,.btn:active{transform:scale(.97)}
.primary,.liftbtn{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
input::placeholder{color:#5f646d}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center} .row>*{flex:1;min-width:120px} .row>.fit{flex:0 0 auto;min-width:0}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0}
.stat b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums} .stat span{font-size:12px;color:var(--muted)}
.feed-card .top{display:flex;justify-content:space-between;gap:8px}
.feed-card a.title{font-weight:700;font-size:17px;color:var(--ink);text-decoration:none}
.thumb{width:100%;height:150px;background:var(--card2);border-radius:10px;margin-top:8px}
.thumb polyline{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{padding:7px 14px;border-radius:999px;font-size:14px}
.tabs button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.streak{display:flex;gap:6px;margin-top:6px}
.streak div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.streak i{display:block;width:22px;height:22px;margin:0 auto 3px;border-radius:50%;background:var(--dot)}
.streak i.on{background:var(--accent)} .streak i.lift{background:var(--lift)}
.meter{height:8px;background:var(--dot);border-radius:4px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px} .meter.lift i{background:var(--lift)} .meter.food i{background:var(--accent)} .meter.over i{background:var(--danger)}
#map{height:340px;border-radius:10px}
.leaflet-container{background:var(--card2)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.splitbar{height:10px;background:var(--accent);border-radius:3px;opacity:.85}
.log-week{display:grid;grid-template-columns:90px repeat(7,1fr) 70px;align-items:center;gap:4px;padding:6px 0;border-bottom:1px solid var(--line)}
.log-week.head{font-size:12px;color:var(--muted)}
.bubble{border-radius:50%;background:var(--accent);opacity:.9;margin:auto} .bubble.lift{background:var(--lift)}
.timer{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center}
.big{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:12px 0}
.big b{font-size:24px;display:block}
.comment{border-top:1px solid var(--line);padding:8px 0}
.kudos.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.empty{text-align:center;padding:40px 16px}
.err{color:var(--danger)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.pill.lift{background:var(--lift-bg);color:var(--lift)}
.pill.good{background:var(--lift-bg);color:var(--good)} .pill.warn{background:rgba(255,181,71,.14);color:var(--warn)} .pill.accent{background:rgba(255,107,74,.14);color:var(--accent)}
.banner{background:var(--lift-bg);color:var(--lift);border-radius:10px;padding:9px 12px;font-size:14px;margin:8px 0}
.daylist a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 12px;border-radius:12px;color:var(--ink);text-decoration:none;border:1px solid transparent}
.daylist a:hover{background:var(--card2)} .daylist a.next{border-color:var(--lift);background:var(--lift-bg)}
.daylist .rest{color:var(--muted);font-size:13px;padding:6px 12px}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.ex{border-top:1px solid var(--line);padding:14px 0}
.ex:first-of-type{border-top:0}
.setrow{display:grid;grid-template-columns:34px 1fr 72px 60px 52px 42px;gap:6px;align-items:center;padding:3px 0}
.setrow.head{font-size:12px;color:var(--muted)}
.setrow input{padding:8px 4px;text-align:center;font-variant-numeric:tabular-nums}
.setrow.done{background:var(--lift-bg);border-radius:10px}
.setrow.done input{background:transparent;border-color:transparent;color:var(--lift)}
.setrow .tag{font-size:12px;font-weight:800;text-align:center;border-radius:8px;padding:6px 0;background:var(--card2)}
.setrow .tag.w{color:var(--warn)}
.check{width:40px;height:36px;padding:0;border-radius:10px}
.check.on{background:var(--lift);border-color:var(--lift);color:var(--on-primary)}
.sticky{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:900}
.resttimer{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--lift);color:var(--on-primary);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.resttimer b{font-size:26px;font-variant-numeric:tabular-nums}
.resttimer button{background:rgba(17,18,20,.12);color:var(--on-primary);border-color:transparent;padding:5px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{padding:6px 14px;border-radius:999px;font-size:13px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rcard{display:block;border:1px solid var(--line);border-radius:var(--radius);padding:13px;text-decoration:none;color:var(--ink);background:var(--card2)}
.rcard:hover{border-color:var(--primary)}
.rcard b{display:block;margin-bottom:4px}
.foodrow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.foodrow:last-child{border-bottom:0}
.x{border:0;background:transparent;color:var(--muted);padding:4px 10px}
ul.ing{padding-left:18px;margin:4px 0} ul.ing li{margin:3px 0} ul.ing li.h{list-style:none;margin-left:-18px;font-weight:700;margin-top:10px;color:var(--primary)}
.steps p{margin:6px 0} .steps h4{margin:14px 0 2px;font-size:14px;color:var(--primary)}

.acct{position:relative;color:var(--muted);display:flex;padding:6px}
.acct svg{width:24px;height:24px}
.acct i{position:absolute;right:3px;top:4px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg);background:var(--dot)}
.acct i[data-s=ok]{background:var(--good)} .acct i[data-s=syncing]{background:var(--warn)} .acct i[data-s=error]{background:var(--danger)} .acct i[data-s=signed-out]{background:var(--muted)}

/* Phone layout: iOS-style bottom tab bar, single column, safe areas. */
@media (max-width:760px){
  .grid{grid-template-columns:1fr !important}
  /* backdrop-filter would make the header the containing block for the fixed tab bar */
  header{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .bar{padding:10px 16px}
  .bar .btn.primary{display:none}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:1000;justify-content:space-around;gap:0;
      background:rgba(17,18,20,.92);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
      border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav a{flex-direction:column;gap:2px;font-size:10.5px;padding:4px 6px;border-radius:10px;min-width:58px}
  nav a svg{width:24px;height:24px}
  nav a.on{background:transparent}
  nav a.rec{display:flex}
  nav a.rec svg{color:var(--primary)}
  main{padding:12px 12px calc(var(--tabbar) + 24px + env(safe-area-inset-bottom))}
  h1{font-size:24px}
  .log-week{grid-template-columns:62px repeat(7,1fr) 52px}
  .setrow{grid-template-columns:30px minmax(0,1fr) 64px 52px 44px 40px;gap:5px}
  .ex > .row:first-child > select{flex:1 1 calc(100% - 50px)}
}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#/feed">STRIDE</a>
  <nav>
    <a href="#/feed" data-nav="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#/programs" data-nav="programs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h2M20 12h2M6 7v10M18 7v10M4 9v6M20 9v6M6 12h12"/></svg>Programs</a>
    <a href="#/record" data-nav="record" class="rec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Record</a>
    <a href="#/meals" data-nav="meals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16a8 8 0 0 1-16 0zM9 7c0-1.5 1-2 1-3M13 7c0-1.5 1-2 1-3"/></svg>Meals</a>
    <a href="#/log" data-nav="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Log</a>
  </nav>
  <span class="spacer"></span>
  <a class="acct" href="#/account" aria-label="Account and sync"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><i id="syncdot" data-s="off"></i></a>
  <a class="btn primary" href="#/record">+ Record</a>
</div></header>
<main id="app"></main>

<script>
// ---------- storage ----------
const KEY = 'stride.v1';
const DEFAULTS = {
  athlete: 'You', weeklyGoalKm: 25, yearGoalKm: 1000, activities: [],
  units: 'lb', program: null, live: null, food: [],
  nutrition: { bodyweight: 180, activity: 16, goal: 'bulk', pct: 10, proteinGoal: null },
};
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)) || {}; return { ...DEFAULTS, ...s, nutrition: { ...DEFAULTS.nutrition, ...(s.nutrition || {}) } }; } catch { return structuredClone(DEFAULTS); } }
let db = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} trackChanges(); scheduleSync(); }

function cachedContent(name){ try { return JSON.parse(localStorage.getItem('stride.content.' + name)); } catch { return null; } }
let PROGRAMS = window.STRIDE_PROGRAMS || cachedContent('programs') || [];
let RECIPES = window.STRIDE_RECIPES || cachedContent('recipes') || [];

// ---------- cloud sync (Supabase) ----------
// Local-first: everything works offline from localStorage. When signed in, each record (activity, food entry,
// settings, program progress) syncs as its own row. The most recent edit of a record wins, like Strong's sync.
const CFG = window.STRIDE_CONFIG || {};
const cloud = CFG.supabaseUrl && CFG.supabaseKey && window.supabase
  ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true } }) : null;
const SKEY = 'stride.sync';
function loadSync(){ const empty = { local:{}, synced:{}, dirty:{}, lastPull:null, lastSync:null };
  try { return { ...empty, ...(JSON.parse(localStorage.getItem(SKEY)) || {}) }; } catch { return empty; } }
let sync = loadSync();
let syncState = { status: cloud ? 'signed-out' : 'off', error: null, email: null };
function saveSync(){ try { localStorage.setItem(SKEY, JSON.stringify(sync)); } catch {} }
function hashStr(s){ let h = 2166136261; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36) + ':' + s.length; }
function localRecords(){
  const m = {};
  for(const a of db.activities) m['activity:' + a.id] = a;
  for(const f of db.food) m['food:' + f.id] = f;
  m['settings:main'] = { athlete: db.athlete, weeklyGoalKm: db.weeklyGoalKm, yearGoalKm: db.yearGoalKm, units: db.units, nutrition: db.nutrition };
  if(db.program) m['program:current'] = db.program;
  return m;
}
// Stamp each record with the time it last changed on this device (compared to what was last synced).
function trackChanges(){
  const now = Date.now(), recs = localRecords();
  for(const [k, v] of Object.entries(recs)){
    const h = hashStr(JSON.stringify(v));
    if(sync.local[k] !== h){ sync.local[k] = h; if(sync.synced[k] !== h) sync.dirty[k] = now; else delete sync.dirty[k]; }
  }
  for(const k of Object.keys(sync.local)) if(!(k in recs)){ delete sync.local[k]; if(sync.synced[k]) sync.dirty[k] = now; else delete sync.dirty[k]; }
  saveSync();
}
function applyRemote(kind, id, data, deleted){
  if(kind === 'activity' || kind === 'food'){
    const list = kind === 'activity' ? 'activities' : 'food';
    db[list] = db[list].filter(x => x.id !== id);
    if(!deleted) db[list].push(data);
    if(kind === 'activity') db.activities.sort((x, y) => y.startedAt - x.startedAt);
  } else if(kind === 'settings' && !deleted){
    Object.assign(db, { athlete: data.athlete, weeklyGoalKm: data.weeklyGoalKm, yearGoalKm: data.yearGoalKm, units: data.units,
      nutrition: { ...DEFAULTS.nutrition, ...(data.nutrition || {}) } });
  } else if(kind === 'program'){ db.program = deleted ? null : data; }
}
let syncing = false, syncTimer = null;
function scheduleSync(delay = 2500){ if(!cloud) return; clearTimeout(syncTimer); syncTimer = setTimeout(runSync, delay); }
async function runSync(){
  if(!cloud || syncing || !navigator.onLine) return;
  const { data: { session } } = await cloud.auth.getSession();
  if(!session){ syncState.status = 'signed-out'; return; }
  syncing = true; syncState = { status: 'syncing', error: null, email: session.user.email }; renderSyncDot();
  let changed = false;
  try {
    trackChanges();
    // 1. Pull everything the server received since our last pull (server clock, so offline edits aren't missed).
    const firstPull = !sync.lastPull; let maxSynced = sync.lastPull;
    for(let from = 0; ; from += 1000){
      let q = cloud.from('stride_records').select('kind,id,data,deleted,updated_at,synced_at').order('synced_at').range(from, from + 999);
      if(sync.lastPull) q = q.gte('synced_at', sync.lastPull);
      const { data: rows, error } = await q; if(error) throw error;
      for(const r of rows){
        const k = r.kind + ':' + r.id, remoteTs = Date.parse(r.updated_at), localTs = sync.dirty[k];
        if(!maxSynced || r.synced_at > maxSynced) maxSynced = r.synced_at;
        if(!firstPull && localTs && localTs > remoteTs) continue; // our newer local edit wins; pushed below
        if(sync.synced[k] && !r.deleted && sync.synced[k] === hashStr(JSON.stringify(r.data))) continue; // already have it
        applyRemote(r.kind, r.id, r.data, r.deleted); changed = true;
        const h = r.deleted ? null : hashStr(JSON.stringify(r.data));
        if(h){ sync.synced[k] = sync.local[k] = h; } else { delete sync.synced[k]; delete sync.local[k]; }
        delete sync.dirty[k];
      }
      if(rows.length < 1000) break;
    }
    if(changed) try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {}
    trackChanges();
    // 2. Push local edits.
    const recs = localRecords(), entries = Object.entries(sync.dirty);
    for(let i = 0; i < entries.length; i += 200){
      const chunk = entries.slice(i, i + 200);
      const rows = chunk.map(([k, ts]) => { const [kind, ...rest] = k.split(':'), v = recs[k];
        return { kind, id: rest.join(':'), data: v ?? null, deleted: !v, updated_at: new Date(ts).toISOString() }; });
      const { error } = await cloud.from('stride_records').upsert(rows, { onConflict: 'user_id,kind,id' }); if(error) throw error;
      for(const [k, ts] of chunk){ if(sync.dirty[k] !== ts) continue; const v = recs[k];
        if(v) sync.synced[k] = hashStr(JSON.stringify(v)); else delete sync.synced[k]; delete sync.dirty[k]; }
    }
    sync.lastPull = maxSynced; sync.lastSync = Date.now(); syncState.status = 'ok';
  } catch(e){ syncState = { ...syncState, status: 'error', error: e.message || String(e) }; }
  finally { syncing = false; saveSync(); renderSyncDot(); }
  // Re-render with pulled changes, except mid-workout where it would interrupt typing.
  if(changed && !location.hash.startsWith('#/workout')) route();
}
async function loadContent(){
  if(!cloud || window.STRIDE_PROGRAMS) return;
  for(const name of ['programs', 'recipes']){
    const { data, error } = await cloud.storage.from('content').download(name + '.json');
    if(error || !data) continue;
    const text = await data.text();
    try { localStorage.setItem('stride.content.' + name, text); } catch {}
    if(name === 'programs') PROGRAMS = JSON.parse(text); else RECIPES = JSON.parse(text);
  }
  if(!location.hash.startsWith('#/workout')) route();
}
async function uploadContent(){
  for(const [name, data] of [['programs', window.STRIDE_PROGRAMS], ['recipes', window.STRIDE_RECIPES]]){
    const { error } = await cloud.storage.from('content').upload(name + '.json', new Blob([JSON.stringify(data)], { type: 'application/json' }), { upsert: true });
    if(error) throw error;
  }
}
function renderSyncDot(){
  const dot = document.getElementById('syncdot'); if(!dot) return;
  dot.dataset.s = syncState.status;
  dot.title = { off: 'Cloud sync not set up', 'signed-out': 'Not signed in', syncing: 'Syncing…', ok: 'Synced', error: 'Sync error: ' + syncState.error }[syncState.status];
}
if(cloud){
  cloud.auth.onAuthStateChange((evt, session) => {
    syncState.email = session?.user?.email || null;
    if(session){ if(syncState.status === 'signed-out') syncState.status = 'ok'; if(evt === 'SIGNED_IN' || evt === 'INITIAL_SESSION'){ loadContent(); scheduleSync(300); } }
    else syncState.status = 'signed-out';
    renderSyncDot();
  });
  addEventListener('online', () => scheduleSync(500));
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') scheduleSync(500); });
  setInterval(() => { if(document.visibilityState === 'visible') runSync(); }, 60000);
}

const TYPES = {
  run:{label:'Run',icon:'🏃',pace:true,intensity:1.0},
  ride:{label:'Ride',icon:'🚴',pace:false,intensity:0.7},
  walk:{label:'Walk',icon:'🚶',pace:true,intensity:0.4},

  yoga:{label:'Yoga',icon:'🧘',pace:false,intensity:0.3,noGps:true},
};

// ---------- math / formatting ----------
function haversine(a,b){ const R=6371000,r=Math.PI/180; const dLa=(b[0]-a[0])*r,dLo=(b[1]-a[1])*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function trackDistance(pts){ let d=0; for(let i=1;i<pts.length;i++) d+=haversine(pts[i-1],pts[i]); return d; }
function elevGain(pts){ let g=0; for(let i=1;i<pts.length;i++){ const a=pts[i-1][3],b=pts[i][3]; if(a!=null&&b!=null&&b>a) g+=b-a; } return g; }
function fmtTime(s){ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`; }
const km = m => (m/1000).toFixed(2);
function pace(sec, meters){ if(!meters) return '–'; const s=sec/(meters/1000); return `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')} /km`; }
function speed(sec, meters){ return sec ? ((meters/1000)/(sec/3600)).toFixed(1)+' km/h' : '–'; }
// Effort score: my own simple stand-in for Strava's (HR-based) Relative Effort.
function effort(a){ return Math.round(a.movingTime/60 * (TYPES[a.type]?.intensity ?? 0.6)); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function startOfWeek(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function dayKey(d){ const x=new Date(d); return `${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`; }
function isoDate(d){ const x=new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
function when(ts){ const d=new Date(ts); return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+' at '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
const uid = () => Math.random().toString(36).slice(2,10);

// Strength helpers: Brzycki 1RM (Strong's default formula), program "1-2" style ranges, rest times like "~2-3 min".
function e1rm(w, reps){ if(!w || !reps || reps < 1) return 0; return w / (1.0278 - 0.0278 * Math.min(reps, 25)); }
const lowNum = s => { const m = String(s).match(/\d+/); return m ? +m[0] : 0; };
function restSeconds(s){ const n = String(s).match(/[\d.]+/g); if(!n || /N\/A/i.test(s)) return 0; const v = n.map(Number); return Math.round((v.length > 1 ? (v[0]+v[1])/2 : v[0]) * 60); }
const baseName = n => String(n).replace(/^(Superset\s+)?[A-Z]\d:\s*/i, '').trim();
const wUnit = () => db.units;

function splits(a){
  const pts=a.points||[]; if(pts.length<2) return [];
  const out=[]; let dist=0, startT=pts[0][2], next=1000;
  for(let i=1;i<pts.length;i++){ dist+=haversine(pts[i-1],pts[i]);
    if(dist>=next){ out.push({km:out.length+1, sec:(pts[i][2]-startT)/1000}); startT=pts[i][2]; next+=1000; } }
  const rem=dist-(next-1000); if(rem>50) out.push({km:out.length+1, sec:(pts.at(-1)[2]-startT)/1000, partial:rem});
  return out;
}

function thumbSvg(pts){
  if(!pts||pts.length<2) return '';
  const la=pts.map(p=>p[0]), lo=pts.map(p=>p[1]); const mnA=Math.min(...la),mxA=Math.max(...la),mnO=Math.min(...lo),mxO=Math.max(...lo);
  const k=Math.cos((mnA+mxA)/2*Math.PI/180); const w=(mxO-mnO)*k||1e-5, h=(mxA-mnA)||1e-5, s=Math.max(w,h);
  const xy=pts.map(p=>`${((p[1]-mnO)*k/s*100+(100-w/s*100)/2).toFixed(2)},${((mxA-p[0])/s*100+(100-h/s*100)/2).toFixed(2)}`).join(' ');
  return `<svg class="thumb" viewBox="-5 -5 110 110" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><polyline points="${xy}"/></svg>`;
}

// ---------- program progress ----------
function programById(id){ return PROGRAMS.find(p => p.id === id); }
function sequence(p){ return p.weeks.flatMap(w => w.days.map((d, i) => ({ w: w.n, i, key: `${w.n}-${i}`, day: d, week: w }))); }
function progress(){
  if(!db.program) return null; const p = programById(db.program.id); if(!p) return null;
  const seq = sequence(p), done = db.program.done || {};
  const nextIdx = seq.findIndex(s => !done[s.key]);
  return { p, seq, done, next: nextIdx < 0 ? null : seq[nextIdx], nextIdx, completed: seq.filter(s => done[s.key]).length };
}
function markDay(pid, key, value){
  if(!db.program || db.program.id !== pid) return;
  db.program.done = db.program.done || {};
  if(value) db.program.done[key] = value; else delete db.program.done[key];
  save();
}

// ---------- nutrition ----------
function calorieTarget(){
  const n = db.nutrition, maint = Math.round(n.bodyweight * n.activity);
  const target = n.goal === 'bulk' ? Math.round(maint * (1 + n.pct/100)) : n.goal === 'cut' ? Math.round(maint * (1 - n.pct/100)) : maint;
  return { maint, target };
}
function foodFor(date){ return db.food.filter(f => f.date === date); }
function totals(entries){ return entries.reduce((t, f) => ({ kcal: t.kcal + f.kcal, protein: t.protein + (f.protein || 0), hasProtein: t.hasProtein || f.protein != null }), { kcal: 0, protein: 0, hasProtein: false }); }

function lastSetsFor(name){
  const b = baseName(name);

}
function startWorkout(p, w, i){

  const d = p ? p.weeks[w-1].days[i] : null;
  db.live = {
    id: uid(), name: d ? d.label : 'Strength workout', startedAt: Date.now(), restEnd: null, restTotal: 0,
    program: d ? { id: p.id, name: p.name, week: w, key: `${w}-${i}`, day: d.label } : null,

      name: e.exercise, plan: e, choice: 0,

}

function finishWorkout(){
  const L = db.live;
  const exercises = L.exercises.map(e => ({ name: e.name, sets: e.sets.filter(s => s.done).map(s => ({ type: s.type, weight: s.weight===''?null:+s.weight, reps: s.reps===''?null:+s.reps, rpe: s.rpe===''?null:+s.rpe })) })).filter(e => e.sets.length);
  if(!exercises.length && !confirm('No sets are checked off. Finish anyway and save an empty workout?')) return;
  // PR = best working-set est. 1RM beats every earlier logged set of the same exercise.
  for(const e of exercises){
    const best = Math.max(0, ...e.sets.filter(s=>s.type!=='W').map(s=>e1rm(s.weight, s.reps)));
    const prior = db.activities.filter(a=>a.strength).flatMap(a=>a.strength.exercises.filter(x=>baseName(x.name)===baseName(e.name)).flatMap(x=>x.sets.filter(s=>s.type!=='W')));
    e.pr = best > 0 && prior.length > 0 && best > Math.max(0, ...prior.map(s=>e1rm(s.weight, s.reps)));
  }
  const volume = exercises.reduce((v,e)=>v+e.sets.filter(s=>s.type!=='W').reduce((x,s)=>x+(s.weight||0)*(s.reps||0),0),0);
  const a = { id: uid(), type: 'weight_training', name: L.name, startedAt: L.startedAt, movingTime: (Date.now()-L.startedAt)/1000,
    distance: 0, elevGain: 0, points: [], notes: '', kudos: 0, kudosGiven: false, comments: [],
    strength: { program: L.program, exercises, volume, unit: db.units } };
  db.activities.push(a); db.activities.sort((x,y)=>y.startedAt-x.startedAt);
  if(L.program) markDay(L.program.id, L.program.key, a.id);
  db.live = null; save(); location.hash = '#/activity/' + a.id;
}

      <div style="margin-top:10px">${entries.length?entries.map(f=>`<div class="foodrow"><div><div>${esc(f.name)}</div><div class="small muted">${f.servings!=null?`${f.servings} × · `:''}${f.kcal} kcal${f.protein!=null?` · ${Math.round(f.protein)} g protein`:''}</div></div><button class="x" data-del="${f.id}" aria-label="Remove">✕</button></div>`).join(''):'<p class="small muted">Nothing logged yet. Pick a recipe or quick-add below.</p>'}</div>
    </div>
    <div class="card"><h3>Quick add</h3>
      <form id="quick"><input name="name" placeholder="Food (e.g. Greek yogurt)" required maxlength="80">
        <div class="row" style="margin-top:8px"><input name="kcal" type="number" min="0" placeholder="kcal" required><input name="protein" type="number" min="0" step="0.1" placeholder="Protein g (optional)"></div>
        <button class="primary" style="margin-top:8px;width:100%">Add</button></form></div>
    <div class="card"><div class="row"><h3 style="margin:0">Calorie target</h3><button class="fit small" id="editT">Edit</button></div>
      <div class="small" style="margin-top:6px">Maintenance ≈ ${maint} kcal <span class="muted">(${n.bodyweight} lb × ${n.activity})</span></div>
      <div class="small"><b>${n.goal==='bulk'?`Lean bulk: +${n.pct}%`:n.goal==='cut'?`Cut: −${n.pct}%`:'Maintain'}</b> → ${target} kcal/day</div>
      <form id="tform" hidden>
        <label>Bodyweight (lb)</label><input name="bw" type="number" min="60" max="600" value="${n.bodyweight}">
        <label>Activity (bodyweight ×)</label><select name="act">${[[14,'14 · less active'],[15,'15'],[16,'16 · typical'],[17,'17'],[18,'18 · very active']].map(([v,l])=>`<option value="${v}" ${n.activity==v?'selected':''}>${l}</option>`).join('')}</select>
        <label>Goal</label><select name="goal">${[['bulk','Lean bulk (surplus)'],['maintain','Maintain / recomp'],['cut','Cut (deficit)']].map(([v,l])=>`<option value="${v}" ${n.goal===v?'selected':''}>${l}</option>`).join('')}</select>
        <label>Surplus / deficit %</label><select name="pct">${[5,7.5,10,12.5,15].map(v=>`<option ${n.pct==v?'selected':''}>${v}</option>`).join('')}</select>
        <label>Protein goal (g, optional)</label><input name="pg" type="number" min="0" value="${n.proteinGoal??''}">
        <p class="small muted">From your Nutrition Booklet: maintenance ≈ bodyweight × 14–18 (16 if unsure). Lean bulk = 5–15% above maintenance.</p>
        <button class="primary">Save</button></form></div>
  </aside><section>
    <div class="card"><h2>Recipes <span class="small muted">· Fit Foodie Cook Book, pork swapped for beef/turkey/chicken</span></h2>
      <input id="q" placeholder="Search recipes or ingredients" value="${esc(mealState.q)}">
      <div class="chips">${cats.map(c=>`<button data-cat="${esc(c)}" class="${c===mealState.cat?'on':''}">${esc(c)}</button>`).join('')}</div>
      <div class="recipes" id="rlist"></div></div>
  </section></div>`;
  function renderList(){
    if(!RECIPES.length){ document.getElementById('rlist').innerHTML = `<p class="muted">Recipes load from your private cloud storage. <a href="#/account">Sign in</a> to get them.</p>`; return; }
    const q = mealState.q.toLowerCase();
    const list = RECIPES.filter(r => (mealState.cat==='All' || r.category===mealState.cat) && (!q || (r.title + ' ' + r.ingredients.join(' ')).toLowerCase().includes(q)));
    document.getElementById('rlist').innerHTML = list.map(r => `<a class="rcard" href="#/recipe/${r.id}">
      <b>${esc(r.title)}</b><div class="small muted">${r.calories} kcal${r.caloriesUnit?' '+esc(r.caloriesUnit):''} · ${r.protein} g protein</div>
      <div class="small muted">Serves ${esc(r.serves)}</div>
      ${r.swapped?'<span class="pill good">Pork swapped</span>':''}</a>`).join('') || '<p class="muted">No recipes match.</p>';
  }
  renderList();
  document.getElementById('q').oninput = e => { mealState.q = e.target.value; renderList(); };
  app.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { mealState.cat = b.dataset.cat; app.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('on', x===b)); renderList(); });
  const shift = n => { const x = new Date(mealState.date + 'T12:00'); x.setDate(x.getDate()+n); mealState.date = isoDate(x); route(); };
  document.getElementById('prevd').onclick = () => shift(-1);
  document.getElementById('nextd').onclick = () => shift(1);
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { db.food = db.food.filter(f=>f.id!==b.dataset.del); save(); route(); });
  document.getElementById('quick').onsubmit = e => { e.preventDefault(); const f=e.target;
    db.food.push({ id: uid(), date: mealState.date, name: f.name.value.trim(), kcal: Math.round(+f.kcal.value), protein: f.protein.value===''?null:+f.protein.value, servings: null }); save(); route(); };
  const tf = document.getElementById('tform');
  document.getElementById('editT').onclick = () => tf.hidden = !tf.hidden;
  tf.onsubmit = e => { e.preventDefault(); db.nutrition = { bodyweight: +tf.bw.value || n.bodyweight, activity: +tf.act.value, goal: tf.goal.value, pct: +tf.pct.value, proteinGoal: tf.pg.value===''?null:+tf.pg.value }; save(); route(); };
}

  const r = RECIPES.find(x=>x.id===id); if(!r){ app.innerHTML = RECIPES.length ? '<div class="card empty">Recipe not found.</div>' : contentMissing('recipes'); return; }
  const per = r.caloriesUnit ? r.caloriesUnit.replace('per ','') : 'serving';
  app.innerHTML = `<div class="card">
    <a class="small" href="#/meals">← Meals</a>
    <div class="small muted" style="margin-top:8px">${esc(r.category)}${r.originalTitle?` · originally "${esc(r.originalTitle)}"`:''}</div>
    <h1>${esc(r.title)}</h1>
    <div class="stats"><div class="stat"><b>${r.calories}</b><span>kcal ${esc(r.caloriesUnit||'')}</span></div><div class="stat"><b>${r.protein} g</b><span>protein</span></div>
      <div class="stat"><b>${r.fat} g</b><span>fat</span></div><div class="stat"><b>${r.carbs} g</b><span>carbs</span></div><div class="stat"><b>${esc(r.serves)}</b><span>serves</span></div></div>
    <div class="small muted">${esc(r.times||'')}</div>
    ${r.notes.map(nt=>`<div class="banner" style="${/swapped|Swapped/.test(nt)?'':'background:var(--bg);color:var(--muted)'}">${esc(nt)}</div>`).join('')}
    <form id="logr" class="row" style="margin-top:10px">
      <label class="fit" style="margin:0">Log</label><input class="fit" style="width:80px" name="s" type="number" min="0.25" step="0.25" value="1">
      <span class="fit small muted">× ${esc(per)} to</span><input class="fit" style="width:150px" name="d" type="date" value="${mealState.date}">
      <span class="fit"><button class="primary">Add to food log</button></span></form>
    <p class="small muted" id="logged"></p>
  </div>
  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)">
    <div class="card"><h2>Ingredients</h2><ul class="ing">${r.ingredients.map(t=>t.startsWith('## ')?`<li class="h">${esc(t.slice(3))}</li>`:`<li>${esc(t)}</li>`).join('')}</ul></div>
    <div class="card steps"><h2>Instructions</h2>${r.steps.map(s=>s.heading?`<h4>${esc(s.heading)}</h4>`:`<p>${esc(s.text)}</p>`).join('')}
      <p class="small muted">Page ${r.page} of the cookbook. Macros as printed in the book${r.caloriesAdjusted?', calories adjusted for the swap':''}.</p></div>
  </div>`;
  document.getElementById('logr').onsubmit = e => { e.preventDefault(); const s = +e.target.s.value || 1;
    db.food.push({ id: uid(), date: e.target.d.value || isoDate(Date.now()), name: r.title, recipeId: r.id, servings: s, kcal: Math.round(r.calories*s), protein: Math.round(r.protein*s*10)/10 });
    save(); document.getElementById('logged').innerHTML = `Added ${Math.round(r.calories*s)} kcal. <a href="#/meals">See food log</a>`; };
}

// ---------- training log ----------
function viewLog(){
  let dim; try { dim = sessionStorage.getItem('stride.dim') || 'distance'; } catch { dim = 'distance'; }
  const val={distance:a=>a.distance/1000, moving_time:a=>a.movingTime/3600, elev_gain:a=>a.elevGain, effort:effort, volume:a=>(a.strength?.volume||0)/1000};
  const unit={distance:'km',moving_time:'h',elev_gain:'m',effort:'',volume:'k '+db.units};
  const acts=db.activities; const byDay={};
  acts.forEach(a=>{ (byDay[dayKey(a.startedAt)] ||= []).push(a); });
  const max=Math.max(1e-9,...Object.values(byDay).map(l=>l.reduce((s,a)=>s+val[dim](a),0)));
  const wk0=startOfWeek(new Date()); let rows='';
  for(let w=0; w<8; w++){
    const ws=new Date(wk0); ws.setDate(ws.getDate()-7*w); let tot=0, cells='';
    for(let d=0; d<7; d++){ const day=new Date(ws); day.setDate(day.getDate()+d); const list=byDay[dayKey(day)]||[];
      const v=list.reduce((s,a)=>s+val[dim](a),0); tot+=v; const size=v?10+30*Math.sqrt(v/max):0; const lift=list.length&&list.every(a=>a.strength);
      cells+= list.length && v ? `<a href="#/activity/${list[0].id}" title="${esc(list.map(a=>a.name).join(', '))}: ${v.toFixed(1)} ${unit[dim]}"><div class="bubble ${lift?'lift':''}" style="width:${size}px;height:${size}px"></div></a>`
        : `<div class="small muted" style="text-align:center">${list.length?'•':day>new Date()?'':'·'}</div>`; }
    rows+=`<div class="log-week"><div class="small">${w===0?'This week':ws.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div>${cells}<div class="small" style="text-align:right"><b>${tot.toFixed(dim==='elev_gain'||dim==='effort'?0:1)}</b> ${unit[dim]}</div></div>`;
  }
  const labels={distance:'Distance',moving_time:'Time',elev_gain:'Elevation',volume:'Volume',effort:'Effort'};
  app.innerHTML=`<div class="card"><h2>Training Log</h2>
    <div class="tabs">${Object.entries(labels).map(([k,l])=>`<button data-dim="${k}" class="${k===dim?'on':''}">${l}</button>`).join('')}</div>
    <div class="log-week head"><div></div>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div style="text-align:center">${d}</div>`).join('')}<div style="text-align:right">Total</div></div>
    ${rows}
    <p class="small muted">Orange = cardio, purple = strength.</p>
  </div>`;
  app.querySelectorAll('[data-dim]').forEach(b=>b.onclick=()=>{ try{sessionStorage.setItem('stride.dim',b.dataset.dim);}catch{} route(); });
}

// ---------- record (GPS) + manual entry ----------
function viewRecord(){
  const typeOpts=Object.entries(TYPES).map(([k,t])=>`<option value="${k}">${t.icon} ${t.label}</option>`).join('');
  const pr = progress();
  app.innerHTML=`<div class="card" style="max-width:560px;margin:0 auto">
    <div class="tabs"><button data-tab="gps" class="on">Record with GPS</button><button data-tab="lift">Strength workout</button><button data-tab="manual">Add manual entry</button></div>
    <div id="gps">
      <label>Sport</label><select id="gtype">${typeOpts}</select>
      <div class="timer" id="clock">0:00</div>
      <div class="big"><div><b id="gdist">0.00</b><span class="small muted">km</span></div><div><b id="gpace">–</b><span class="small muted">pace</span></div><div><b id="gpts">0</b><span class="small muted">GPS points</span></div></div>
      <p id="gmsg" class="small muted">Location is only used while recording and stays in this browser.</p>
      <div class="row"><button class="primary" id="start">Start</button><button id="pause" disabled>Pause</button><button id="finish" disabled>Finish</button></div>
    </div>
    <div id="lift" hidden>
      ${db.live?`<p>You have <b>${esc(db.live.name)}</b> in progress.</p><a class="btn liftbtn" href="#/workout">Resume workout</a>`
        : pr && pr.next && !pr.next.day.rest ? `<p>Up next in <b>${esc(pr.p.name)}</b>: Week ${pr.next.w}, ${esc(pr.next.day.label)}.</p><a class="btn liftbtn" href="#/day/${pr.p.id}/${pr.next.key}">Open program workout</a>`
        : `<p class="muted">Follow a program to get premade workouts, or log your own.</p><a class="btn liftbtn" href="#/programs">Browse programs</a>`}
      <button style="margin-left:8px" id="emptyw">Start an empty workout</button>
    </div>
    <form id="manual" hidden>
      <label>Title</label><input name="name" placeholder="Morning Run">
      <div class="row"><div><label>Sport</label><select name="type">${typeOpts}</select></div>
        <div><label>Date &amp; time</label><input type="datetime-local" name="when" required></div></div>
      <div class="row"><div><label>Distance (km)</label><input type="number" step="0.01" min="0" name="dist" value="0"></div>
        <div><label>Elevation (m)</label><input type="number" min="0" name="elev" value="0"></div></div>
      <div class="row"><div><label>Hours</label><input type="number" min="0" name="h" value="0"></div>
        <div><label>Minutes</label><input type="number" min="0" max="59" name="m" value="30"></div>
        <div><label>Seconds</label><input type="number" min="0" max="59" name="s" value="0"></div></div>
      <label>Notes</label><textarea name="notes" rows="2"></textarea>
      <div style="margin-top:12px"><button class="primary">Save activity</button></div>
    </form>
  </div>`;
  const panes={gps:document.getElementById('gps'), lift:document.getElementById('lift'), manual:document.getElementById('manual')};
  const tabs=app.querySelectorAll('[data-tab]');
  tabs.forEach(b=>b.onclick=()=>{ tabs.forEach(x=>x.classList.toggle('on',x===b)); for(const k in panes) panes[k].hidden = k!==b.dataset.tab; });
  document.getElementById('emptyw').onclick=()=>startWorkout(null);
  const manual=panes.manual;
  const nowLocal=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16); manual.when.value=nowLocal;
  manual.onsubmit=e=>{ e.preventDefault(); const f=manual; const sec=(+f.h.value)*3600+(+f.m.value)*60+(+f.s.value);
    if(sec<=0){ alert('Add a duration.'); return; }
    const a=newActivity(f.type.value, new Date(f.when.value).getTime(), sec, (+f.dist.value)*1000, +f.elev.value, [], f.name.value.trim(), f.notes.value.trim());
    location.hash='#/activity/'+a.id; };

  let watch=null, tick=null, running=false, pts=[], moving=0, lastT=null, started=null;
  const $=id=>document.getElementById(id);
  function render(){ const d=trackDistance(pts); $('clock').textContent=fmtTime(moving/1000); $('gdist').textContent=km(d);
    $('gpace').textContent=d>20?pace(moving/1000,d).replace(' /km',''):'–'; $('gpts').textContent=pts.length; }
  function onPos(p){ if(!running) return; const c=p.coords;
    if(c.accuracy>50){ $('gmsg').textContent=`Waiting for a better GPS fix (±${Math.round(c.accuracy)} m)…`; return; }
    const pt=[c.latitude,c.longitude,p.timestamp,c.altitude];
    if(!pts.length || haversine(pts.at(-1),pt)>3) pts.push(pt);
    $('gmsg').textContent=`GPS ok (±${Math.round(c.accuracy)} m)`; render(); }
  function onErr(e){ $('gmsg').innerHTML=`<span class="err">GPS unavailable: ${esc(e.message)}. You can still use manual entry.</span>`; }
  $('start').onclick=()=>{
    if(!navigator.geolocation){ onErr({message:'not supported'}); return; }
    if(!started) started=Date.now();
    running=true; lastT=Date.now();
    watch ??= navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});
    tick=setInterval(()=>{ const n=Date.now(); moving+=n-lastT; lastT=n; render(); },500);
    $('start').disabled=true; $('pause').disabled=false; $('finish').disabled=false; $('gtype').disabled=true; };
  $('pause').onclick=()=>{ running=false; clearInterval(tick); $('start').disabled=false; $('start').textContent='Resume'; $('pause').disabled=true; };
  $('finish').onclick=()=>{ running=false; clearInterval(tick); if(watch!=null) navigator.geolocation.clearWatch(watch); watch=null;
    const a=newActivity($('gtype').value, started, moving/1000, trackDistance(pts), elevGain(pts), pts);
    location.hash='#/activity/'+a.id; };
  cleanup=()=>{ clearInterval(tick); if(watch!=null) navigator.geolocation.clearWatch(watch); };
}

function defaultName(type, ts){ const h=new Date(ts).getHours(); const part=h<5?'Night':h<12?'Morning':h<14?'Lunch':h<18?'Afternoon':h<21?'Evening':'Night';
  return `${part} ${TYPES[type]?.label||'Activity'}`; }
function newActivity(type, startedAt, movingTime, distance, elev, points, name, notes){
  const a={ id:uid(), type, startedAt, movingTime, distance, elevGain:elev||0,
    points, name:name||defaultName(type,startedAt), notes:notes||'', kudos:0, kudosGiven:false, comments:[] };
  db.activities.push(a); db.activities.sort((x,y)=>y.startedAt-x.startedAt); save(); return a;
}

// ---------- sample data (synthetic loops around Golden Gate Park) ----------
function seedSample(){
  const base=[37.7694,-122.4862]; const now=Date.now();
  const plan=[[0,'run',5.2],[1,'ride',24],[2,'run',8.1],[4,'walk',3.0],[6,'run',10.0],[8,'ride',40],[9,'weight_training',0],[11,'run',6.4],[13,'hike',7.5],[15,'run',12.0],[17,'ride',32],[19,'run',5.0]];
  plan.forEach(([daysAgo,type,distKm],i)=>{
    const start=now-daysAgo*864e5-(7+i%5)*36e5; const t=TYPES[type];
    const secPerKm={run:330,ride:130,walk:720,hike:600}[type]||300;
    let pts=[], sec=distKm*secPerKm*(0.9+Math.random()*0.2);
    if(!t.noGps){ const n=Math.max(40,Math.round(distKm*25)); const r=distKm/(2*Math.PI)/111; const ang0=Math.random()*6.28;
      for(let j=0;j<=n;j++){ const ang=ang0+j/n*2*Math.PI; const wob=1+0.15*Math.sin(ang*5+i);
        pts.push([base[0]+r*wob*Math.sin(ang), base[1]+r*wob*Math.cos(ang)/0.79, start+sec*1000*j/n, 20+15*Math.sin(ang*2+i)]); } }
    else sec=45*60;
    const a=newActivity(type,start,sec,pts.length?trackDistance(pts):0,elevGain(pts),pts);
    if(type==='weight_training'){ a.name='Sample Push Day'; a.strength={ program:null, unit:db.units, exercises:[
      { name:'Barbell Bench Press', sets:[{type:'W',weight:95,reps:8},{type:'N',weight:185,reps:6,rpe:8},{type:'N',weight:185,reps:6,rpe:9},{type:'N',weight:175,reps:8,rpe:9}] },
      { name:'Seated DB Shoulder Press', sets:[{type:'N',weight:55,reps:10,rpe:9},{type:'N',weight:55,reps:9,rpe:10}] } ], volume:0 };
      a.strength.volume=a.strength.exercises.reduce((v,e)=>v+e.sets.filter(s=>s.type!=='W').reduce((x,s)=>x+s.weight*s.reps,0),0); }
    a.kudos=Math.floor(Math.random()*12); if(i%3===0) a.comments.push({who:'Sam',text:'Nice one!',at:start+36e5});
  });
  save();
}

route();
if('serviceWorker' in navigator && isSecureContext) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
